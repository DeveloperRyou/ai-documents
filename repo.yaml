# ai-documents repo.yaml
#
# Registers which repos this manages, by git remote -- not by local path.
# install.sh scans search_paths for a clone whose git remote matches, and
# caches the result in <anchor>/path.json (machine-specific, lives
# outside this repo entirely).
#
#   anchor: <path>                 # optional, defaults to /opt/ai-documents
#                                   # (a plain user-owned dir -- see README.md
#                                   # for the one-time `sudo` setup this needs)
#   search_paths:                  # required, at least one entry
#     - <dir to scan for clones>
#   repos:
#     - name: <unique-key>         # must match a folder under projects/<name>/
#       remote: <git remote url>   # matched against any of that repo's
#                                   # `git remote -v` entries (any remote name)
#       path: <absolute path>      # optional manual override, skips scanning
#
# One line per field, no inline comments after a value, no flow-style
# ([a, b]) lists. See README.md for the full workflow, and
# projects/README.md for the projects/_common/ convention.

anchor: /opt/ai-documents

search_paths:
  - ~/Develop

repos:
  - name: portfolio
    remote: https://github.com/DeveloperRyou/portfolio.git

  - name: ai-documents
    remote: https://github.com/DeveloperRyou/ai-documents.git
